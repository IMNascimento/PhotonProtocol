[workspace]
resolver = "3"
members = ["core", "cli", "wasm"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Set by `raptorq`, not by this code: it uses `let` chains and AVX-512
# intrinsics, both of which stabilised well after the 1.85 that edition 2024
# alone would require. Declaring the edition's floor instead would be a promise
# the workspace cannot keep.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IMNascimento/PhotonProtocol"
homepage = "https://github.com/IMNascimento/PhotonProtocol"
authors = ["Igor Nascimento and the PhotonProtocol contributors"]

[workspace.dependencies]
photon-core = { path = "core", version = "0.3.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The protocol works in cell counts, byte offsets and bit widths. Silent
# truncation there is a correctness bug, so make the casts explicit failures
# rather than warnings we learn to scroll past.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

# Counts and small indices are converted to f32 to average them. The values
# involved are cell and sub-cell tallies, orders of magnitude below the 24 bits
# an f32 holds exactly, so the lint fires only on conversions that cannot lose
# anything -- and drowns the ones above, which can.
cast_precision_loss = "allow"

# Deliberately not enabled. The classifier and the frame geometry are built on
# fixed-size arrays indexed by loop counters the compiler can see are in range,
# where rewriting every access as `.get(i).unwrap()` costs clarity and buys no
# safety. Slice and vector accesses that genuinely could be out of range are
# written with `get` by hand.
# indexing_slicing = "warn"

# The test suite runs the codec and the detector over megapixel images. Left
# unoptimised those are minutes of work rather than seconds, and a suite nobody
# wants to wait for is a suite that stops being run. Debug assertions and
# overflow checks stay on, which is the part that actually catches bugs.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The browser bundle is optimised for size, the command line for speed. They
# want opposite things from the same code: one is downloaded over the connection
# its user is trying to avoid, the other grinds through thousands of frames.
[profile.release.package.photon-wasm]
opt-level = "z"

# The decoder is the expensive half and is always built in release, but it is
# also the half that needs a debugger. Keep symbols.
[profile.release.package.photon-cli]
debug = 1
