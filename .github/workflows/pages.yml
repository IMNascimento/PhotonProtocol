name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: a partially replaced
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build the WebAssembly package
        run: wasm-pack build wasm --release --target web --out-dir pkg

      - name: Check the bindings from JavaScript
        # The same round trip a page performs, through the generated glue rather
        # than through Rust. A buffer sized wrongly across the boundary passes
        # every Rust test and fails here.
        run: |
          wasm-pack build wasm --release --target nodejs --out-dir pkg-node
          node tools/wasm-smoke.mjs

      - name: Optimise the bundle
        # wasm-pack's own invocation is disabled because the binaryen build it
        # downloads crashes on Windows. Doing it here keeps contributors able to
        # build while the copy that is actually served is still optimised.
        run: |
          npm install --no-save wasm-opt
          before=$(stat -c%s wasm/pkg/photon_wasm_bg.wasm)
          npx wasm-opt -Oz --enable-bulk-memory \
            -o wasm/pkg/photon_wasm_bg.wasm wasm/pkg/photon_wasm_bg.wasm
          after=$(stat -c%s wasm/pkg/photon_wasm_bg.wasm)
          echo "wasm: $before -> $after bytes"

      - name: Assemble
        run: node tools/build-site.mjs site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
